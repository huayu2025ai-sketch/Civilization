services:
  civilization:
    build:
      context: .
      dockerfile: Dockerfile
    image: civilization-guide:latest
    container_name: civilization-guide
    expose:
      - "80"
    networks:
      - npm_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  npm_default:
    external: true
