services:
  civilization:
    build:
      context: .
      dockerfile: Dockerfile
    image: civilization-guide:latest
    container_name: civilization-guide
    ports:
      - "${CIVILIZATION_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
